name: CI Build, Publish to GHCR, Deploy to VPS

on:
  push:
    branches: [ dev ]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install & Build
        run: npm ci && npm run build

      - name: "Debug: secrets presence (no secret values shown)"
        run: |
          echo "Checking repository secrets presence (will not print values)"
          if [ -n "${{ secrets.VPS_SSH_PRIVATE_KEY }}" ]; then echo "VPS_SSH_PRIVATE_KEY=present"; else echo "VPS_SSH_PRIVATE_KEY=missing"; fi
          if [ -n "${{ secrets.VPS_HOST }}" ]; then echo "VPS_HOST=present"; else echo "VPS_HOST=missing"; fi
          if [ -n "${{ secrets.VPS_USER }}" ]; then echo "VPS_USER=present"; else echo "VPS_USER=missing"; fi
          if [ -n "${{ secrets.VPS_SSH_PORT }}" ]; then echo "VPS_SSH_PORT=present"; else echo "VPS_SSH_PORT=missing"; fi

      - name: Check deploy secrets
        id: check_deploy
        run: |
          # set deploy output to true only if both required secrets are present
          if [ -n "${{ secrets.VPS_SSH_PRIVATE_KEY }}" ] && [ -n "${{ secrets.VPS_HOST }}" ]; then
            echo "deploy=true" >> $GITHUB_OUTPUT
          else
            echo "deploy=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload `dist` to VPS 
        if: steps.check_deploy.outputs.deploy == 'true'
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          source: "dist/*"
          target: "${{ secrets.VPS_TARGET_DIR }}/releases/${{ github.sha }}"

      - name: Finalize deploy on VPS 
        if: steps.check_deploy.outputs.deploy == 'true'
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            set -euo pipefail
            RELEASE_DIR="${{ secrets.VPS_TARGET_DIR }}/releases/${{ github.sha }}"
            CURRENT_DIR="${{ secrets.VPS_TARGET_DIR }}/current"

            echo "Preparing release dir: $RELEASE_DIR"
            mkdir -p "${{ secrets.VPS_TARGET_DIR }}/releases"
            # ensure uploaded files exist
            if [ ! -d "$RELEASE_DIR" ]; then
              echo "ERROR: release directory not found: $RELEASE_DIR"
              exit 1
            fi

            # set ownership to deploy user (best-effort)
            chown -R ${{ secrets.VPS_USER }}:${{ secrets.VPS_USER }} "$RELEASE_DIR" || true

            # update current symlink
            ln -sfn "$RELEASE_DIR" "$CURRENT_DIR"
            chown -h ${{ secrets.VPS_USER }}:${{ secrets.VPS_USER }} "$CURRENT_DIR" || true

            # reload nginx if present (may require sudo on some systems)
            if command -v nginx >/dev/null 2>&1; then
              echo "Reloading nginx"
              sudo systemctl reload nginx || true
            fi
