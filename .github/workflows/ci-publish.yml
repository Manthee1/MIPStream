name: CI Build, Publish to GHCR, Deploy to VPS

on:
  push:
    branches: [ dev ]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install & Build
        run: npm ci && npm run build

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mipstream:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/mipstream:latest

      - name: Deploy to VPS via SSH (optional)
        if: ${{ secrets.VPS_SSH_PRIVATE_KEY && secrets.VPS_HOST }}
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            set -euo pipefail
            IMAGE=ghcr.io/${{ github.repository_owner }}/mipstream:${{ github.sha }}
            LATEST=ghcr.io/${{ github.repository_owner }}/mipstream:latest

            if [ -n "${{ secrets.VPS_GHCR_TOKEN || '' }}" ]; then
              echo "Logging into ghcr.io on VPS"
              echo "${{ secrets.VPS_GHCR_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
            fi

            echo "Pulling image $IMAGE"
            docker pull "$IMAGE" || docker pull "$LATEST"

            if [ -n "${{ secrets.VPS_DOCKER_COMPOSE_PATH || '' }}" ]; then
              if command -v docker-compose >/dev/null 2>&1; then
                docker-compose -f "${{ secrets.VPS_DOCKER_COMPOSE_PATH }}" pull || true
                docker-compose -f "${{ secrets.VPS_DOCKER_COMPOSE_PATH }}" up -d
              else
                docker compose -f "${{ secrets.VPS_DOCKER_COMPOSE_PATH }}" pull || true
                docker compose -f "${{ secrets.VPS_DOCKER_COMPOSE_PATH }}" up -d
              fi
            else
              # fallback: restart a named container
              docker rm -f mipstream || true
              docker run -d --name mipstream -p 80:80 --restart unless-stopped "$LATEST"
            fi
