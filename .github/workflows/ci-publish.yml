name: CI Build, Publish to GHCR, Deploy to VPS

on:
  push:
    branches: [ dev ]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install & Build
        run: npm ci && npm run build

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ghcr.io/manthee1/mipstream:${{ github.sha }}
            ghcr.io/manthee1/mipstream:latest
      
      
      - name: "Debug: secrets presence (no secret values shown)"
        run: |
          echo "Checking repository secrets presence (will not print values)"
          if [ -n "${{ secrets.VPS_SSH_PRIVATE_KEY }}" ]; then echo "VPS_SSH_PRIVATE_KEY=present"; else echo "VPS_SSH_PRIVATE_KEY=missing"; fi
          if [ -n "${{ secrets.VPS_HOST }}" ]; then echo "VPS_HOST=present"; else echo "VPS_HOST=missing"; fi
          if [ -n "${{ secrets.VPS_USER }}" ]; then echo "VPS_USER=present"; else echo "VPS_USER=missing"; fi
          if [ -n "${{ secrets.VPS_GHCR_TOKEN }}" ]; then echo "VPS_GHCR_TOKEN=present"; else echo "VPS_GHCR_TOKEN=missing"; fi
          if [ -n "${{ secrets.VPS_DOCKER_COMPOSE_PATH }}" ]; then echo "VPS_DOCKER_COMPOSE_PATH=present"; else echo "VPS_DOCKER_COMPOSE_PATH=missing"; fi
          if [ -n "${{ secrets.VPS_SSH_PORT }}" ]; then echo "VPS_SSH_PORT=present"; else echo "VPS_SSH_PORT=missing"; fi

      - name: Check deploy secrets
        id: check_deploy
        run: |
          # set deploy output to true only if both required secrets are present
          if [ -n "${{ secrets.VPS_SSH_PRIVATE_KEY }}" ] && [ -n "${{ secrets.VPS_HOST }}" ]; then
            echo "deploy=true" >> $GITHUB_OUTPUT
          else
            echo "deploy=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to VPS via SSH (optional)
        if: steps.check_deploy.outputs.deploy == 'true'
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            set -euo pipefail
            IMAGE=ghcr.io/manthee1/mipstream:${{ github.sha }}
            LATEST=ghcr.io/manthee1/mipstream:latest

            if [ -n "${{ secrets.VPS_GHCR_TOKEN || '' }}" ]; then
              echo "Logging into ghcr.io on VPS"
              echo "${{ secrets.VPS_GHCR_TOKEN }}" | docker login ghcr.io -u "deploy" --password-stdin
            fi

            echo "Pulling image $IMAGE"
            docker pull "$IMAGE" || docker pull "$LATEST"

            if [ -n "${{ secrets.VPS_DOCKER_COMPOSE_PATH || '' }}" ]; then
              if command -v docker-compose >/dev/null 2>&1; then
                docker-compose -f "${{ secrets.VPS_DOCKER_COMPOSE_PATH }}" pull || true
                docker-compose -f "${{ secrets.VPS_DOCKER_COMPOSE_PATH }}" up -d
              else
                docker compose -f "${{ secrets.VPS_DOCKER_COMPOSE_PATH }}" pull || true
                docker compose -f "${{ secrets.VPS_DOCKER_COMPOSE_PATH }}" up -d
              fi
            else
              # fallback: restart a named container
              docker rm -f mipstream || true
              docker run -d --name mipstream -p 80:80 --restart unless-stopped "$LATEST"
            fi
