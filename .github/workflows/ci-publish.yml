name: CI Build, Publish to GHCR, Deploy to VPS

on:
  push:
    branches: [ dev ]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install & Build
        run: npm ci && npm run build

      - name: "Debug: secrets presence (no secret values shown)"
        run: |
          echo "Checking repository secrets presence (will not print values)"
          if [ -n "${{ secrets.VPS_SSH_PRIVATE_KEY }}" ]; then echo "VPS_SSH_PRIVATE_KEY=present"; else echo "VPS_SSH_PRIVATE_KEY=missing"; fi
          if [ -n "${{ secrets.VPS_HOST }}" ]; then echo "VPS_HOST=present"; else echo "VPS_HOST=missing"; fi
          if [ -n "${{ secrets.VPS_USER }}" ]; then echo "VPS_USER=present"; else echo "VPS_USER=missing"; fi
          if [ -n "${{ secrets.VPS_SSH_PORT }}" ]; then echo "VPS_SSH_PORT=present"; else echo "VPS_SSH_PORT=missing"; fi

      - name: Check deploy secrets
        id: check_deploy
        run: |
          # set deploy output to true only if both required secrets are present
          if [ -n "${{ secrets.VPS_SSH_PRIVATE_KEY }}" ] && [ -n "${{ secrets.VPS_HOST }}" ]; then
            echo "deploy=true" >> $GITHUB_OUTPUT
          else
            echo "deploy=false" >> $GITHUB_OUTPUT
          fi

      - name: Create tarball of `dist` for upload
        if: steps.check_deploy.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          TAR=dist-${{ github.sha }}.tar.gz
          rm -f "$TAR"
          # create tarball containing only the contents of dist (no top-level dist/ dir)
          tar -C dist -czf "$TAR" .

      - name: Upload dist tarball to VPS
        if: steps.check_deploy.outputs.deploy == 'true'
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          source: "dist-${{ github.sha }}.tar.gz"
          target: "${{ secrets.VPS_TARGET_DIR }}"

      - name: Extract dist tarball on VPS
        if: steps.check_deploy.outputs.deploy == 'true'
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            set -euo pipefail
            TAR="dist-${{ github.sha }}.tar.gz"
            cd "${{ secrets.VPS_TARGET_DIR }}"
            if [ ! -f "$TAR" ]; then
              echo "ERROR: tarball not found: $TAR"
              exit 1
            fi
            tar -xzf "$TAR"
            rm -f "$TAR"

